app = "trail-justin"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "20s"   # must stay above shutdown-timeout in litestream.yml

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/trail.db"

[mounts]
  source = "trail_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1gb"
  auto_extend_size_limit = "5gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # never stop when idle: a wake takes ~7 s (the Litestream binary is read from a slow disk before node starts), and the request that wakes it can fail
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

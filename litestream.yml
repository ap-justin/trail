# Litestream 0.5: continuous backup of trail's SQLite file to Tigris.
# Credentials come from the app's secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, set by `fly storage create`; BUCKET_NAME too.

# Fly sends SIGTERM on stop; Litestream passes it to node, waits for the
# drain (4 s), then ships the last WAL changes. Fly's kill_timeout
# (fly.toml) must stay above shutdown-timeout.
shutdown-timeout: 15s
shutdown-sync-timeout: 8s

# A full snapshot a day, kept 7 days: point-in-time restore over the last week.
snapshot:
  interval: 24h
  retention: 168h

exec: node --enable-source-maps /app/dist/index.js

dbs:
  - path: /data/trail.db
    # an empty volume (new Machine, lost volume) restores from Tigris first;
    # with no backup yet it starts fresh
    restore-if-db-not-exists: true
    replica:
      type: s3
      bucket: ${BUCKET_NAME}
      path: trail.db
      endpoint: fly.storage.tigris.dev
      region: auto
      # uploads at most every 5 s while writes happen; nothing when idle
      sync-interval: 5s
